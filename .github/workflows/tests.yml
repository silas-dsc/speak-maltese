name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The test suite deliberately touches no model weights and no network: it
      # exercises the scheduler, the Maltese text handling, the phonetic matcher
      # and the authored decks. So CI installs the light dependencies only —
      # torch and faster-whisper are multi-gigabyte and prove nothing here.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" python-multipart python-dotenv httpx pytest

      - name: Tests
        run: python -m pytest tests/ -q

      - name: Deck and dialogue integrity
        run: |
          python scripts/coverage.py
